[package]
name = "memory-organiser"
version = "0.1.0"
description = "Organise and search a Claude chat export"
authors = ["Graham Coulby"]
license = "MIT"
edition = "2024"
rust-version = "1.90"

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name, which
# otherwise collides on Windows (rust-lang/cargo#8519).
name = "memory_organiser_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "~2.7", features = [] }

[dependencies]
tauri = { version = "~2.12", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rusqlite = { version = "0.41", features = ["bundled-sqlcipher-vendored-openssl"] }
argon2 = "0.6"
zeroize = "1"
getrandom = "0.3"
hex = "0.4"
sha2 = "0.10"
zip = { version = "9", default-features = false, features = ["deflate"] }
tauri-plugin-dialog = "~2.8"
tauri-plugin-opener = "~2.7"
keyring = { version = "~3.6", features = ["apple-native", "windows-native"] }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls", "http2"] }

[lints.clippy]
unwrap_used = "deny"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
tempfile = "3"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-process = "~2.4"
tauri-plugin-updater = "~2.14"
